<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header preview — Option A</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1a365d;
        --blue: #2b6cb0;
        --ink: #2d3748;
        --cream: #fdf9ef;
        --yellow: #ffcc00;
        --yellow-soft: #ffe98a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Avenir Next', -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: var(--ink);
        background: #fff;
        padding: 2rem 0 4rem;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

    /* desktop-proportion stage: renders at true 1100px, scaled to fit narrow panels */
    .stage-outer { overflow: hidden; margin-bottom: 3rem; }
    .stage { width: 1100px; transform-origin: top left; }

    .label {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #a0aec0;
        margin-bottom: 0.75rem;
    }

    /* ---- header ---- */
    header {
        position: relative;
        background: var(--cream);
        border-radius: 18px;
        padding: 2.25rem 16rem 2.25rem 2.5rem;
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        gap: 2.25rem;
        align-items: center;
        overflow: hidden;
    }

    .profile-img {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--yellow-soft);
    }

    .name {
        color: var(--navy);
        line-height: 1.15;
        font-weight: 400;
    }

    .name-en {
        font-family: 'Kaushan Script', cursive;
        font-size: 2.9rem;
    }

    .name-zh {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2.1rem;
        color: var(--blue);
        margin-left: 0.4rem;
    }

    .title {
        font-size: 1.02rem;
        color: var(--ink);
        font-weight: 500;
        margin-top: 0.55rem;
    }

    .title .mark {
        background: linear-gradient(transparent 56%, var(--yellow) 56%);
        padding: 0 2px;
    }

    .links {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1.25rem;
        margin-top: 1.35rem;
    }

    .links a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.86rem;
        font-weight: 500;
        color: var(--blue);
        text-decoration: none;
        padding-bottom: 2px;
        border-bottom: 1.5px solid transparent;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .links a:hover {
        color: var(--navy);
        border-bottom-color: var(--yellow);
    }

    .links svg { width: 15px; height: 15px; flex: none; }

    .links .sep {
        width: 1px;
        height: 14px;
        background: #e4dcc6;
    }

    /* ---- mascots ---- */
    .loafy-wrap, .loopy-wrap { position: absolute; bottom: -14px; }
    .loafy-wrap { right: 112px; width: 112px; height: 160px; }
    .loopy-wrap { right: 8px; width: 96px; height: 138px; }

    .loafy-wrap img, .loopy-wrap img {
        width: 100%; height: 100%;
        object-fit: contain;
        object-position: center bottom;
        display: block;
        transform-origin: center bottom;
        transition: transform 0.2s ease;
    }
    .loopy-wrap img { transform: scaleX(-1); }
    .loafy-wrap:hover img { transform: translateY(-3px); }
    .loopy-wrap:hover img { transform: scaleX(-1) translateY(-3px); }

    /* in the real site this is @media (max-width: 820px); here it's a class
       so the desktop stage above can render at its true width inside a narrow panel */
    header.is-narrow {
        grid-template-columns: 1fr;
        gap: 1.25rem;
        padding: 1.75rem 1.5rem 1.5rem;
    }
    header.is-narrow .name-en { font-size: 2.1rem; }
    header.is-narrow .name-zh { font-size: 1.6rem; }
    header.is-narrow .loafy-wrap,
    header.is-narrow .loopy-wrap { display: none; }
</style>
</head>
<body>
<div class="container">
    <p class="label">Option A — desktop (1100px, scaled to fit)</p>
</div>

<div class="stage-outer">
  <div class="stage" id="stage">
    <div style="padding: 0 2rem;">
    <header>
        <img src="static/avatar.png" alt="Liwei Jiang" class="profile-img"
             onmouseover="this.src='static/avatar2.png'" onmouseout="this.src='static/avatar.png'">

        <div class="header-content">
            <h1 class="name">
                <span class="name-en">Liwei Jiang</span><span class="name-zh">姜力炜</span>
            </h1>

            <p class="title">Research scientist at <span class="mark">NVIDIA</span></p>

            <div class="links">
                <a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>lwjiang@cs.washington.edu</a>
                <span class="sep"></span>

                <a href="https://www.linkedin.com/in/liwei-jiang-jlw/"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</a>
                <a href="https://x.com/liweijianglw"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>X</a>
                <span class="sep"></span>
                <a href="#bio"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Bio</a>
                <a href="static/CV.pdf"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 2 4.5 4.5H14V4zM8 12h8v1.5H8V12zm0 3h8v1.5H8V15z"/></svg>CV</a>
            </div>
        </div>

        <div class="loafy-wrap"><img src="static/loafyheader.png" alt="Loafy"></div>
        <div class="loopy-wrap"><img src="static/loopyheader.png" alt="Loopy"></div>
    </header>
    </div>
  </div>
</div>

<div class="container">
    <p class="label">Option A — narrow / mobile</p>
    <div style="max-width: 420px; border: 0.5px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
      <header class="is-narrow">
        <img src="static/avatar.png" alt="Liwei Jiang" class="profile-img" style="width: 92px; height: 92px;">
        <div>
          <h1 class="name">
            <span class="name-en" style="font-size: 2.1rem;">Liwei Jiang</span><span class="name-zh" style="font-size: 1.6rem;">姜力炜</span>
          </h1>
          <p class="title">Research scientist at <span class="mark">NVIDIA</span></p>
          <div class="links" style="gap: 0.9rem;">
            <a href="#">Email</a><a href="#">Scholar</a><a href="#">GitHub</a><a href="#">X</a><a href="#">Bio</a><a href="#">CV</a>
          </div>
        </div>
      </header>
    </div>
</div>

<script>
  function fitStage() {
    var stage = document.getElementById('stage');
    var outer = stage.parentElement;
    var scale = Math.min(1, outer.clientWidth / 1100);
    stage.style.transform = 'scale(' + scale + ')';
    outer.style.height = (stage.offsetHeight * scale) + 'px';
  }
  fitStage();
  window.addEventListener('resize', fitStage);
  window.addEventListener('load', fitStage);
</script>
</body>
</html>
